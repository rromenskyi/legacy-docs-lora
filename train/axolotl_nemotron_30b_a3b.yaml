# QLoRA config for nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
# (NemotronH: hybrid Mamba2 + Attention + MoE, 52 layers).
#
# Base: Axolotl's own upstream example
# (examples/nemotron-h/nemotron-3_5-lightning-30b-a3b-qlora.yaml), with
# lora_r/alpha and lora_target_parameters changed to match the recipe
# already validated on this exact architecture by this account's own
# ipsupport-code LoRA (quant-ternary/nemotron-extreme-quant/docs/FINETUNING.md):
# q/k/v/o_proj via lora_target_modules, MoE expert up/down_proj via
# lora_target_parameters (they're 3D nn.Parameter tensors here, not
# nn.Linear, so the normal module-targeting path doesn't reach them).
# lora_dropout must stay 0 -- axolotl's ParamWrapper path for the 3D
# expert tensors doesn't support dropout.
#
# Requires `--merge_method legacy` at merge time: the default merge
# silently drops LoRA weights applied via lora_target_parameters on
# this architecture (confirmed by checking the reported "Applied LoRA
# to N/M tensors" count, not just the exit code).
#
# Not yet run for this project -- dataset path below is a placeholder.

base_model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - axolotl.integrations.liger.LigerPlugin

liger_layer_norm: true
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_rms_norm_gated: true

# Attention kernels support mixer blocks; relu2 experts use the MoE backend.
lora_mlp_kernel: false
lora_qkv_kernel: true
lora_o_kernel: true

chat_template: tokenizer_default
datasets:
  - path: ../dataset/dataset.jsonl   # output of ../dataset/generate.py
    type: chat_template
    # generate.py already writes {"messages": [{"role": ..., "content": ...}]},
    # which matches axolotl's chat_template default -- no field_messages/
    # message_property_mappings override needed.

val_set_size: 0.05
output_dir: ./outputs/out
dataset_prepared_path: last_run_prepared

sequence_len: 4096
sample_packing: true

load_in_4bit: true
quantize_moe_experts: true
adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
lora_target_parameters:
  - up_proj
  - down_proj

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 2
micro_batch_size: 1
num_epochs: 2
optimizer: adamw_torch_4bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

resume_from_checkpoint:
logging_steps: 1
attn_implementation: flash_attention_2

warmup_ratio: 0.1
evals_per_epoch: 4
saves_per_epoch: 1
weight_decay: 0.0

special_tokens:
